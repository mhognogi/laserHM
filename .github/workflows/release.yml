# Builds LaserHM installers and attaches them to a draft GitHub Release.
# Runs when a version tag (e.g. v0.1.0) is pushed.
# Windows only. macOS is off: it needs a Mac to test on and, for users not to be
# blocked by Gatekeeper, an Apple Developer account to sign the app. To build it,
# uncomment its lines in the matrix below.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write # needed to create the release and upload files
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          # - platform: macos-latest # Apple Silicon (M1+)
          #   args: '--target aarch64-apple-darwin'
          # - platform: macos-latest # Intel Macs
          #   args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS runner is Apple Silicon; add the Intel target too
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # __VERSION__ is replaced with the app version
          releaseName: 'LaserHM v__VERSION__'
          releaseBody: 'Download the installer for your system from the Assets below.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
