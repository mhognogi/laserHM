<!-- App icon: a 445 nm laser beam crossing the icon diagonally, with a star-shaped
     flare and a glowing ring at the center, on a black rounded background.
     Generate all sizes with: npm run tauri icon src-tauri/icons/icon-flare-source.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2f4dff" stop-opacity="0.95" />
      <stop offset="0.35" stop-color="#001AFF" stop-opacity="0.55" />
      <stop offset="1" stop-color="#001AFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.4" stop-color="#e6eaff" />
      <stop offset="1" stop-color="#8fa0ff" stop-opacity="0" />
    </radialGradient>
    <filter id="blur-wide" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="blur-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <!-- Tapered rays pointing right from the center; rotated copies make the star. -->
    <polygon id="ray-long" points="512,503 900,512 512,521" fill="#dfe5ff" />
    <polygon id="ray-short" points="512,506 740,512 512,518" fill="#aab8ff" />
    <!-- Everything is cut to the rounded square, so the glow never spills past its corners. -->
    <clipPath id="rounded">
      <rect width="1024" height="1024" rx="180" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1024" height="1024" fill="#000006" />

    <!-- Large blue glow around the center -->
    <circle cx="512" cy="512" r="470" fill="url(#glow)" />

    <!-- Beam crossing the whole icon through the center: wide glow, then the bright core -->
    <line x1="-60" y1="836" x2="1084" y2="188" stroke="#001AFF" stroke-width="120" opacity="0.5" filter="url(#blur-wide)" />
    <line x1="-60" y1="836" x2="1084" y2="188" stroke="#4a66ff" stroke-width="36" filter="url(#blur-soft)" />
    <line x1="-60" y1="836" x2="1084" y2="188" stroke="#d6ddff" stroke-width="12" />

    <!-- Glowing ring -->
    <circle cx="512" cy="512" r="235" fill="none" stroke="#5f78ff" stroke-width="22" opacity="0.55" filter="url(#blur-soft)" />
    <circle cx="512" cy="512" r="235" fill="none" stroke="#c3cdff" stroke-width="5" opacity="0.8" />

    <!-- Star-shaped flare: 8 long rays and 8 short rays in between -->
    <g filter="url(#blur-soft)">
      <use href="#ray-long" transform="rotate(0 512 512)" />
      <use href="#ray-long" transform="rotate(45 512 512)" />
      <use href="#ray-long" transform="rotate(90 512 512)" />
      <use href="#ray-long" transform="rotate(135 512 512)" />
      <use href="#ray-long" transform="rotate(180 512 512)" />
      <use href="#ray-long" transform="rotate(225 512 512)" />
      <use href="#ray-long" transform="rotate(270 512 512)" />
      <use href="#ray-long" transform="rotate(315 512 512)" />
      <use href="#ray-short" transform="rotate(22.5 512 512)" />
      <use href="#ray-short" transform="rotate(67.5 512 512)" />
      <use href="#ray-short" transform="rotate(112.5 512 512)" />
      <use href="#ray-short" transform="rotate(157.5 512 512)" />
      <use href="#ray-short" transform="rotate(202.5 512 512)" />
      <use href="#ray-short" transform="rotate(247.5 512 512)" />
      <use href="#ray-short" transform="rotate(292.5 512 512)" />
      <use href="#ray-short" transform="rotate(337.5 512 512)" />
    </g>

    <!-- White-hot core -->
    <circle cx="512" cy="512" r="170" fill="url(#core)" filter="url(#blur-soft)" />
    <circle cx="512" cy="512" r="60" fill="#ffffff" />
  </g>
</svg>
